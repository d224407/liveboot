name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CFLAGS: "-Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,--gc-sections -s"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build liveboot ARMv7 (32-bit)
        run: |
          mkdir -p build/armv7
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          $CLANG $CFLAGS -o build/armv7/liveboot src/liveboot.c
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/armv7/liveboot
          echo "ARMv7 size: $(ls -lh build/armv7/liveboot | awk '{print $5}')"

      - name: Build liveboot ARMv8 (64-bit)
        run: |
          mkdir -p build/armv8
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          $CLANG $CFLAGS -o build/armv8/liveboot src/liveboot.c
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/armv8/liveboot
          echo "ARMv8 size: $(ls -lh build/armv8/liveboot | awk '{print $5}')"

      - name: Build liveboot x86 (32-bit)
        run: |
          mkdir -p build/x86
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          $CLANG $CFLAGS -o build/x86/liveboot src/liveboot.c
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/x86/liveboot
          echo "x86 size: $(ls -lh build/x86/liveboot | awk '{print $5}')"

      - name: Build liveboot x86_64 (64-bit)
        run: |
          mkdir -p build/x86_64
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          $CLANG $CFLAGS -o build/x86_64/liveboot src/liveboot.c
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/x86_64/liveboot
          echo "x86_64 size: $(ls -lh build/x86_64/liveboot | awk '{print $5}')"

      - name: Prepare Magisk module
        run: |
          MODULE_DIR="liveboot"
          mkdir -p "$MODULE_DIR/system/bin"
          
          cp -r template/* "$MODULE_DIR/"
          
          cp build/armv7/liveboot "$MODULE_DIR/system/bin/liveboot_32"
          cp build/armv8/liveboot "$MODULE_DIR/system/bin/liveboot_64"
          cp build/x86/liveboot "$MODULE_DIR/system/bin/liveboot_x86"
          cp build/x86_64/liveboot "$MODULE_DIR/system/bin/liveboot_x64"
          
          chmod 755 "$MODULE_DIR/system/bin/"*
          find "$MODULE_DIR" -type f -name "*.sh" -exec chmod 755 {} +
          
          cd "$MODULE_DIR" && zip -r9 "../liveboot.zip" . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liveboot
          path: liveboot.zip